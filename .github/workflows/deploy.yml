name: Deploy Demo to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install resume-cli
        run: npm install -g resume-cli

      - name: Build demo page
        run: |
          mkdir -p _site
          resume export _site/index.html --theme . --resume resume.sample.json

      - name: Check for CNAME and preserve it
        run: |
          # Try to fetch existing CNAME from the deployed site
          curl -f https://roman-pinchuk.github.io/jsonresume-theme-modern-plain/CNAME -o _site/CNAME 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
