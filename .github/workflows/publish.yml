name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify version is newer than npm latest
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          LATEST_VERSION=$(npm view "$PACKAGE_NAME" dist-tags.latest || true)

          if [ -n "$LATEST_VERSION" ] && [ "$LATEST_VERSION" != "null" ]; then
            node -e "const parse = (v) => v.split('.').map(Number); const [current, latest] = process.argv.slice(1).map(parse); for (let i = 0; i < 3; i++) { if (current[i] > latest[i]) process.exit(0); if (current[i] < latest[i]) { console.error(process.argv[1] + ' is older than npm latest ' + process.argv[2] + '; refusing to publish.'); process.exit(1); } } console.error(process.argv[1] + ' is the same as npm latest ' + process.argv[2] + '; refusing to publish.'); process.exit(1);" "$PACKAGE_VERSION" "$LATEST_VERSION"
          fi

      - name: Publish to npm
        run: npm publish
